{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <base href="{% static 'kiosk/' %}" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bharatgas Kiosk</title>

    <link rel="icon" type="image/png" href="{% static 'kiosk/images/favicon/favicon-96x96.png' %}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{% static 'kiosk/images/favicon/favicon.svg' %}" />
    <link rel="shortcut icon" href="{% static 'kiosk/images/favicon/favicon.ico' %}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'kiosk/images/favicon/apple-touch-icon.png' %}" />
    <link rel="manifest" href="{% static 'kiosk/images/favicon/site.webmanifest' %}" />
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" type="text/css" href="{% static 'kiosk/css/bootstrap.min.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'kiosk/css/style.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'kiosk/css/responsive.css' %}">

  </head>
  <body class="blue-bg">
    {% comment %} <section class="main-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 col-md-12 col-12">
                    <div class="welcome-content">
                        <img src="{% static 'images/logo.svg' %}" class="img-fluid logo" alt="" title="Bharat Gas" />
                        <h1>Welcome to <br/> Bharatgas!</h1>
                        <a href="language.html" class="btn btn-primary">Let's Start</a>
                    </div>
                </div>
            </div>
        </div>
    </section> {% endcomment %}
    {% block content%}
    {% endblock%}
    <script src="{% static 'kiosk/js/jquery.min.js' %}"></script>
    <script src="{% static 'kiosk/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'kiosk/js/popper.min.js' %}" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    
    {% if request.path == '/kiosk/validation-process/' %}
      <script>
        let elapsedTime = 0;
        const maxTime = 20;
        const timerElement = document.getElementById('timer');

        function updateTimer() {
            const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
            const seconds = (elapsedTime % 60).toString().padStart(2, '0');
            timerElement.textContent = `${minutes}:${seconds}`;
            
            elapsedTime++;

            if (elapsedTime > maxTime) {
              clearInterval(timerInterval);
                $('#errorModal').modal('show');
             
            }
        }
        $.ajax({
            url: '{{ API_ENDPOINTS.Cylinder_validate_ai }}',
            type: 'get', 
            timeout: maxTime*1000,
            success: function(data) {
              console.log(data.isValidCylinder)
              if(data.isValidCylinder==true){
                clearInterval(timerInterval);
                timerElement.textContent = "Completed!"
                setTimeout(()=> {
                   window.location.href= "/kiosk/validation-success/"
               }, 8000); 
              }
              else{
                clearInterval(timerInterval);
              timerElement.textContent = "Please Try Again"
              alert(data.ValidationDetails)
              }
            },
            error: function(data) { 
              if (status === "timeout") {
                console.log("The request timed out.");
            } else {
                console.log("An error occurred:", error);
            }
              clearInterval(timerInterval);
              timerElement.textContent = "Try Again"
            }
        }); 
        // Start the timer
        let timerInterval = setInterval(updateTimer, 1000);
        updateTimer(); // Initial call to display the starting time
        // End

        {% comment %} setTimeout(function() {
        }, 5000); {% endcomment %}
      </script>
    {% endif %}
    {% if request.path == '/kiosk/placement-refill/' %}
    <script>
    $(document).ready(function () {
      $('#cylindervalidate').on('click', function () {
          $.ajax({
              url: 'chambervalidateapi', 
              method: 'GET', 
              
              success: function (response) {
                  if (response.success) {
                     window.location.href= "/kiosk/customer-details/"
                  } else {
                      $('#responseMessage').text('Error: ' + response.message).css('color', 'red');
                  }
              },
              error: function (xhr, status, error) {
                  $('#responseMessage').text('An error occurred: ' + error).css('color', 'red');
                    }
                });
            });
        });
      </script>
      {% endif %}
    
  </body>
</html>
